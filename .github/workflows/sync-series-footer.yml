name: Shared series footer
on:
  workflow_call:
    inputs:
      series:
        required: true
        type: string
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SonghaiFan/SonghaiFan
          path: .series-footer-source
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/apply-series-footer.py
            assets/footers/
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply shared banner
        env:
          SERIES: ${{ inputs.series }}
        run: python .series-footer-source/scripts/apply-series-footer.py --series "$SERIES" --templates-root .series-footer-source
      - name: Publish README changes
        run: |
          git diff --check
          for file in README.md README.zh-CN.md README_zh.md; do
            if test -f "$file"; then git add "$file"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: sync shared series footer'
          git push
